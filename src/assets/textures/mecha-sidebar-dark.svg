    <line x1="22" y1="0" x2="22" y2="1000" stroke-width="1"/>
    <path d="M16 40 L22 40 M16 80 L22 80 M16 120 L22 120 M16 160 L22 160 M16 200 L22 200 M16 240 L22 240 M16 280 L22 280 M16 320 L22 320 M16 360 L22 360 M16 400 L22 400 M16 440 L22 440 M16 480 L22 480 M16 520 L22 520 M16 560 L22 560 M16 600 L22 600 M16 640 L22 640 M16 680 L22 680 M16 720 L22 720 M16 760 L22 760 M16 800 L22 800 M16 840 L22 840 M16 880 L22 880 M16 920 L22 920 M16 960 L22 960" stroke-width="1.2"/>
  </g>

  <!-- 垂直大字喷漆 -->
  <g font-family="'Impact', 'JetBrains Mono', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" opacity="0.03" transform="rotate(90 160 500)">
