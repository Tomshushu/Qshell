  <!-- 警戒条纹 -->
  <rect x="0" y="0" width="320" height="6" fill="url(#hazard-side-dark)" opacity="0.8"/>
  <rect x="0" y="994" width="320" height="6" fill="url(#hazard-side-dark)" opacity="0.8"/>
