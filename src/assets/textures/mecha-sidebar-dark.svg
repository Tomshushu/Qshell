      <stop offset="0%" stop-color="#16191D"/>
      <stop offset="85%" stop-color="#131619"/>
      <stop offset="100%" stop-color="#0E1012"/>
    </linearGradient>

    <pattern id="hazard-side-dark" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#FFCC00" stroke-width="8"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="#121518" stroke-width="8"/>
