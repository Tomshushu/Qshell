<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- 钛合金冷灰底色渐变 -->
    <linearGradient id="mecha-bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4E7EB"/>
      <stop offset="50%" stop-color="#DCE0E5"/>
      <stop offset="100%" stop-color="#D4D9DF"/>
    </linearGradient>

    <!-- 六边形蜂窝装甲图案 (Honeycomb Armor Grid) -->
    <pattern id="hex-armor-light" width="48" height="83.14" patternUnits="userSpaceOnUse">
      <path d="M48 0 L24 13.86 L0 0 L0 27.71 L24 41.57 L48 27.71 Z M0 41.57 L24 55.43 L48 41.57 L48 69.28 L24 83.14 L0 69.28 Z" 
            fill="none" stroke="#9AA5B2" stroke-width="0.75" opacity="0.3"/>
    </pattern>

    <!-- 警戒斑马纹 (Hazard Caution Stripes) -->
    <pattern id="hazard-pattern" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFCC00" stroke-width="10"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#1A1D20" stroke-width="10"/>
    </pattern>
  </defs>

  <!-- 底板 -->
  <rect width="1600" height="900" fill="url(#mecha-bg-light)"/>

  <!-- 蜂窝装甲网格层 -->
  <rect width="1600" height="900" fill="url(#hex-armor-light)"/>

  <!-- 战术工程十字准星阵列 (Crosshairs) -->
  <g stroke="#8A97A8" stroke-width="1" opacity="0.25">
    <path d="M190 140 L210 140 M200 130 L200 150"/>
    <path d="M590 140 L610 140 M600 130 L600 150"/>
    <path d="M990 140 L1010 140 M1000 130 L1000 150"/>
    <path d="M1390 140 L1410 140 M1400 130 L1400 150"/>
    <path d="M190 440 L210 440 M200 430 L200 450"/>
    <path d="M590 440 L610 440 M600 430 L600 450"/>
    <path d="M990 440 L1010 440 M1000 430 L1000 450"/>
    <path d="M1390 440 L1410 440 M1400 430 L1400 450"/>
    <path d="M190 740 L210 740 M200 730 L200 750"/>
    <path d="M590 740 L610 740 M600 730 L600 750"/>
    <path d="M990 740 L1010 740 M1000 730 L1000 750"/>
    <path d="M1390 740 L1410 740 M1400 730 L1400 750"/>
  </g>

  <!-- 战术雷达圆环与瞄准坐标 (HUD Telemetry Reticle) -->
  <g transform="translate(1320, 680)" opacity="0.25">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#7A8798" stroke-width="1.2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#7A8798" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#7A8798" stroke-width="1.2"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#7A8798" stroke-width="0.8"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#7A8798" stroke-width="0.8"/>
    <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="#7A8798" stroke-width="1.2"/>
    <text x="50" y="-110" fill="#4B5665" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">HUD // TACTICAL RADAR [LOC: 44.02]</text>
  </g>

  <!-- 机甲格纳库大型喷漆战术文字 (Military Stencil Decals) -->
  <g font-family="'JetBrains Mono', 'Impact', sans-serif" font-weight="900" opacity="0.14" fill="#1E2328">
    <text x="60" y="830" font-size="64" letter-spacing="6">BAY-07 // MECHA HANGAR</text>
    <text x="60" y="860" font-size="16" letter-spacing="4" font-family="'JetBrains Mono', monospace">TACTICAL SPECIFICATION RX-78 // CATAPULT DOCK DECK</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#3D4754" opacity="0.35">
    <!-- 顶部坐标 -->
    <text x="30" y="30">[ SEC: 04-A // HYDRAULIC CATAPULT READY ]</text>
    <text x="1350" y="30">[ STATUS: ARMED // ONLINE ]</text>
    <!-- 四角装甲卡扣符号 -->
    <path d="M20 50 L20 20 L50 20" fill="none" stroke="#3D4754" stroke-width="2.5"/>
    <path d="M1580 50 L1580 20 L1550 20" fill="none" stroke="#3D4754" stroke-width="2.5"/>
    <path d="M20 850 L20 880 L50 880" fill="none" stroke="#3D4754" stroke-width="2.5"/>
    <path d="M1580 850 L1580 880 L1550 880" fill="none" stroke="#3D4754" stroke-width="2.5"/>
  </g>

  <!-- 底部警戒黄黑斑马线条带 (Bottom Hazard Rail) -->
  <rect x="0" y="888" width="1600" height="12" fill="url(#hazard-pattern)" opacity="0.75"/>
  <rect x="0" y="0" width="1600" height="5" fill="url(#hazard-pattern)" opacity="0.5"/>
</svg>