<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1000" width="100%" height="100%">
  <defs>
    <!-- 端砚竖幅夜色渐变 -->
    <linearGradient id="sidebar-night-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171A"/>
      <stop offset="50%" stop-color="#121417"/>
      <stop offset="100%" stop-color="#0E1012"/>
    </linearGradient>

    <!-- 月光冷竹竿渐变 -->
    <linearGradient id="bamboo-night-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#889BB2" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#889BB2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#889BB2" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- 1. 底板 -->
  <rect width="320" height="1000" fill="url(#sidebar-night-dark)"/>

  <!-- 2. 底部山石小景 -->
  <path d="M0 960 
           Q 40 920, 90 935 
           Q 140 890, 200 930 
           Q 260 910, 320 950 
           L 320 1000 L 0 1000 Z" 
        fill="#889BB2" opacity="0.06"/>

  <!-- 3. 近景清冷夜竹竿 -->
  <g>
    <path d="M72 980 L70 850" stroke="url(#bamboo-night-light)" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 842 L68 700" stroke="url(#bamboo-night-light)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M68 692 L66 540" stroke="url(#bamboo-night-light)" stroke-width="5" stroke-linecap="round"/>
    <path d="M66 532 L64 380" stroke="url(#bamboo-night-light)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M64 372 L62 210" stroke="url(#bamboo-night-light)" stroke-width="4" stroke-linecap="round"/>
    <path d="M62 202 L60 50"  stroke="url(#bamboo-night-light)" stroke-width="3" stroke-linecap="round"/>

    <!-- 竹节骨线 -->
    <g stroke="#889BB2" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.25">
      <path d="M66 846 Q70 844 74 846"/>
      <path d="M64 696 Q68 694 72 696"/>
      <path d="M62 536 Q66 534 70 536"/>
      <path d="M60 376 Q64 374 68 376"/>
      <path d="M58 206 Q62 204 66 206"/>
    </g>

    <!-- 副竹 -->
    <path d="M108 970 L110 860" stroke="url(#bamboo-night-light)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M110 852 L112 730" stroke="url(#bamboo-night-light)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M112 722 L114 600" stroke="url(#bamboo-night-light)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M114 592 L116 460" stroke="url(#bamboo-night-light)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 4. 夜色月影竹叶 -->
  <g fill="#A5B8CC">
    <g opacity="0.16">
      <path d="M68 692 Q95 675 130 682 Q100 690 68 692 Z"/>
      <path d="M130 682 Q165 670 195 680 Q160 690 130 682 Z"/>
      <path d="M130 682 Q155 695 185 715 Q150 705 130 682 Z"/>
      <path d="M68 692 Q45 680 15 685 Q40 695 68 692 Z"/>
    </g>
    <g opacity="0.14">
      <path d="M66 532 Q100 515 140 520 Q105 530 66 532 Z"/>
      <path d="M140 520 Q180 505 215 515 Q175 525 140 520 Z"/>
      <path d="M140 520 Q175 530 205 550 Q170 545 140 520 Z"/>
    </g>
    <g opacity="0.12">
      <path d="M64 372 Q95 350 135 355 Q100 365 64 372 Z"/>
      <path d="M135 355 Q170 340 205 348 Q165 360 135 355 Z"/>
      <path d="M64 372 Q40 355 12 360 Q38 372 64 372 Z"/>
    </g>
    <g opacity="0.10">
      <path d="M62 202 Q90 185 125 190 Q95 200 62 202 Z"/>
      <path d="M125 190 Q155 175 185 182 Q150 195 125 190 Z"/>
    </g>
  </g>

  <!-- 5. 幽篁朱砂印章 -->
  <g transform="translate(268, 930)" opacity="0.55">
    <rect width="18" height="32" rx="2" fill="#E04E4A"/>
    <text x="9" y="14" fill="#FFFFFF" font-size="8" font-family="'STSong', serif" text-anchor="middle" font-weight="bold">幽</text>
    <text x="9" y="25" fill="#FFFFFF" font-size="8" font-family="'STSong', serif" text-anchor="middle" font-weight="bold">篁</text>
  </g>
</svg>