<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- 左橙右青高维冷暖对撞底色渐变 -->
    <linearGradient id="br-ambient-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBF7F4"/>
      <stop offset="35%" stop-color="#F7F8FA"/>
      <stop offset="65%" stop-color="#F3F9FA"/>
      <stop offset="100%" stop-color="#EEF7F8"/>
    </linearGradient>

    <!-- 霓虹橙外发光滤镜 -->
    <filter id="neon-glow-orange" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 霓虹青外发光滤镜 -->
    <filter id="neon-glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 左侧橙色雾霭光晕 -->
    <radialGradient id="mist-orange" cx="18%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#FF6B35" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>

    <!-- 右侧青色全息光晕 -->
    <radialGradient id="mist-cyan" cx="82%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#08D9D6" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#08D9D6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#08D9D6" stop-opacity="0"/>
    </radialGradient>

    <!-- 极细科技蜂窝底纹 -->
    <pattern id="hex-grid-dual" width="64" height="110.8" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M 32 0 L 64 18.5 L 64 55.4 L 32 73.9 L 0 55.4 L 0 18.5 Z M 32 110.8 L 64 92.3 L 64 55.4 L 32 73.9 L 0 55.4 L 0 92.3 Z" fill="none" stroke="#64748B" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <!-- 微刻度网格 -->
    <pattern id="grid-dots-dual" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="#FF6B35" opacity="0.15"/>
      <circle cx="40" cy="40" r="0.8" fill="#08D9D6" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- 1. 底板背景 -->
  <rect width="1600" height="900" fill="url(#br-ambient-base)"/>
  <rect width="1600" height="900" fill="url(#hex-grid-dual)"/>
  <rect width="1600" height="900" fill="url(#grid-dots-dual)"/>

  <!-- 2. 左橙右青大环境雾霭漫射 -->
  <rect width="1600" height="900" fill="url(#mist-orange)"/>
  <rect width="1600" height="900" fill="url(#mist-cyan)"/>

  <!-- 3. 地平线透视激光网格 (Perspective Ground Laser Grid: 左半橙 · 右半青) -->
  <g opacity="0.32">
    <!-- 左半区透视橙色光线 -->
    <line x1="800" y1="580" x2="-250" y2="900" stroke="#FF6B35" stroke-width="1.2" filter="url(#neon-glow-orange)"/>
    <line x1="800" y1="580" x2="60" y2="900" stroke="#FF6B35" stroke-width="1"/>
    <line x1="800" y1="580" x2="320" y2="900" stroke="#FF6B35" stroke-width="0.85"/>
    <line x1="800" y1="580" x2="560" y2="900" stroke="#FF6B35" stroke-width="0.75"/>
    
    <!-- 中央分界光束 -->
    <line x1="800" y1="580" x2="800" y2="900" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- 右半区透视青色光线 -->
    <line x1="800" y1="580" x2="1040" y2="900" stroke="#08D9D6" stroke-width="0.75"/>
    <line x1="800" y1="580" x2="1280" y2="900" stroke="#08D9D6" stroke-width="0.85"/>
    <line x1="800" y1="580" x2="1540" y2="900" stroke="#08D9D6" stroke-width="1"/>
    <line x1="800" y1="580" x2="1850" y2="900" stroke="#08D9D6" stroke-width="1.2" filter="url(#neon-glow-cyan)"/>

    <!-- 横向递增激光刻线 -->
    <line x1="0" y1="600" x2="1600" y2="600" stroke="#94A3B8" stroke-width="0.6"/>
    <line x1="0" y1="626" x2="1600" y2="626" stroke="#94A3B8" stroke-width="0.75"/>
    <line x1="0" y1="662" x2="800" y2="662" stroke="#FF6B35" stroke-width="0.9"/>
    <line x1="800" y1="662" x2="1600" y2="662" stroke="#08D9D6" stroke-width="0.9"/>
    <line x1="0" y1="715" x2="800" y2="715" stroke="#FF6B35" stroke-width="1.1"/>
    <line x1="800" y1="715" x2="1600" y2="715" stroke="#08D9D6" stroke-width="1.1"/>
    <line x1="0" y1="790" x2="800" y2="790" stroke="#FF6B35" stroke-width="1.3" filter="url(#neon-glow-orange)"/>
    <line x1="800" y1="790" x2="1600" y2="790" stroke="#08D9D6" stroke-width="1.3" filter="url(#neon-glow-cyan)"/>
    <line x1="0" y1="885" x2="800" y2="885" stroke="#FF6B35" stroke-width="1.5" filter="url(#neon-glow-orange)"/>
    <line x1="800" y1="885" x2="1600" y2="885" stroke="#08D9D6" stroke-width="1.5" filter="url(#neon-glow-cyan)"/>
  </g>

  <!-- 4. 左侧霓虹暖橙巨构线框 (Orange Neon Tyrell Scrapers) -->
  <g transform="translate(80, 240)">
    <!-- 巨构主楼 1 -->
    <rect x="0" y="80" width="160" height="260" fill="none" stroke="#FF6B35" stroke-width="1.4" opacity="0.45" filter="url(#neon-glow-orange)"/>
    <!-- 内部斜拉钢结构线 -->
    <line x1="0" y1="80" x2="160" y2="340" stroke="#FF6B35" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.3"/>
    <line x1="160" y1="80" x2="0" y2="340" stroke="#FF6B35" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.3"/>
    <!-- 天线信标 -->
    <line x1="80" y1="0" x2="80" y2="80" stroke="#FF6B35" stroke-width="1.8" filter="url(#neon-glow-orange)"/>
    <circle cx="80" cy="0" r="3.5" fill="#FF6B35" filter="url(#neon-glow-orange)"/>
    <!-- 橙色侧立面 HUD 霓虹看板 -->
    <rect x="180" y="140" width="18" height="120" rx="2" fill="none" stroke="#FF6B35" stroke-width="1.5" opacity="0.6" filter="url(#neon-glow-orange)"/>
    <circle cx="189" cy="160" r="3" fill="#FF6B35"/>
    <circle cx="189" cy="185" r="3" fill="#FF6B35"/>
    <circle cx="189" cy="210" r="3" fill="#FF6B35"/>
    <circle cx="189" cy="235" r="2" fill="#FF6B35"/>
  </g>

  <!-- 5. 右侧霓虹冷青全息巨构线框 (Cyan Neon Hologram Towers) -->
  <g transform="translate(1330, 210)">
    <!-- 全息巨塔 -->
    <rect x="0" y="70" width="170" height="300" fill="none" stroke="#08D9D6" stroke-width="1.4" opacity="0.5" filter="url(#neon-glow-cyan)"/>
    <!-- 楼层横梁线 -->
    <line x1="0" y1="140" x2="170" y2="140" stroke="#08D9D6" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="210" x2="170" y2="210" stroke="#08D9D6" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="280" x2="170" y2="280" stroke="#08D9D6" stroke-width="0.8" opacity="0.35"/>
    <!-- 天线高塔信标 -->
    <line x1="85" y1="0" x2="85" y2="70" stroke="#08D9D6" stroke-width="1.8" filter="url(#neon-glow-cyan)"/>
    <circle cx="85" cy="0" r="3.5" fill="#08D9D6" filter="url(#neon-glow-cyan)"/>
    <!-- 青色侧立面全息看板 -->
    <rect x="-35" y="130" width="22" height="140" rx="2" fill="none" stroke="#08D9D6" stroke-width="1.5" opacity="0.6" filter="url(#neon-glow-cyan)"/>
    <circle cx="-24" cy="155" r="3" fill="#08D9D6"/>
    <circle cx="-24" cy="180" r="3" fill="#08D9D6"/>
    <circle cx="-24" cy="205" r="3" fill="#08D9D6"/>
    <circle cx="-24" cy="230" r="2" fill="#08D9D6"/>
  </g>

  <!-- 6. 高维 HUD 刻度与冷暖对撞信标 (HUD Telemetry & Reticle) -->
  <!-- 左上方：橙色末世扇区标识 -->
  <g transform="translate(100, 95)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FF6B35" letter-spacing="1.5" filter="url(#neon-glow-orange)">[SECTOR 2049 // AMBER SUNSET]</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B" letter-spacing="1">COORD: 34.0522°N, 118.2437°W // ATMOSPHERE: 92.4%</text>
    <line x1="0" y1="26" x2="280" y2="26" stroke="#FF6B35" stroke-width="1.2" opacity="0.6" filter="url(#neon-glow-orange)"/>
  </g>

  <!-- 右上方：冷青色全息罗盘与信标刻度 -->
  <g transform="translate(1380, 130)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#08D9D6" stroke-width="1" stroke-dasharray="5 3" opacity="0.6" filter="url(#neon-glow-cyan)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#08D9D6" stroke-width="0.75" opacity="0.4"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#FF6B35" stroke-width="1.5" filter="url(#neon-glow-orange)"/>
    <line x1="-75" y1="0" x2="75" y2="0" stroke="#08D9D6" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="-75" x2="0" y2="75" stroke="#08D9D6" stroke-width="0.8" opacity="0.6"/>
    <text x="14" y="-52" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#08D9D6" letter-spacing="1">HOLO // 360°</text>
  </g>

  <!-- 中央高空：连接橙青两极的激光数据桥 -->
  <g opacity="0.45">
    <line x1="420" y1="180" x2="800" y2="180" stroke="#FF6B35" stroke-width="1" stroke-dasharray="8 4" filter="url(#neon-glow-orange)"/>
    <circle cx="800" cy="180" r="4" fill="#FF6B35" filter="url(#neon-glow-orange)"/>
    <line x1="800" y1="180" x2="1180" y2="180" stroke="#08D9D6" stroke-width="1" stroke-dasharray="8 4" filter="url(#neon-glow-cyan)"/>
    <circle cx="800" cy="180" r="2" fill="#08D9D6"/>
  </g>
</svg>