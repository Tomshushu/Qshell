    <ellipse cx="4.8" cy="10.8" rx="2.5" ry="2" fill="#FFF0F5"/>
  </g>

  <!-- Deep Pink Squished Paw Beans -->
  <ellipse cx="5.5" cy="6" rx="1.8" ry="1.4" fill="#FF1493"/>
  <ellipse cx="10.8" cy="4" rx="1.8" ry="1.4" fill="#FF1493"/>
