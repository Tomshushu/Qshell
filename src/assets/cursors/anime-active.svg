<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" fill="none">
  <!-- Tight Press Shadow -->
  <g transform="translate(0.5, 0.5)" opacity="0.25">
    <ellipse cx="11.5" cy="13.5" rx="6" ry="4.5" fill="#000000"/>
    <ellipse cx="5.5" cy="6" rx="3" ry="2.5" fill="#000000"/>
    <ellipse cx="10.8" cy="4" rx="3" ry="2.5" fill="#000000"/>
    <ellipse cx="15.8" cy="6" rx="3" ry="2.5" fill="#000000"/>
    <ellipse cx="4.8" cy="10.8" rx="2.5" ry="2" fill="#000000"/>
  </g>

  <!-- Squished Paw Body (Wider, pressed down against surface) -->
  <g stroke="#3D2033" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M5.5 10.5 C3.5 13 4.8 19 11.5 19 C18.2 19 19.5 13 17.5 10.5 C15.5 12 7.5 12 5.5 10.5 Z" fill="#FFF0F5"/>
