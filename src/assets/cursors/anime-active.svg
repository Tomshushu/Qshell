  <ellipse cx="4.8" cy="10.8" rx="1.5" ry="1.2" fill="#FF1493"/>

  <!-- Squished Main Meat Pad -->
  <path d="M8 13.8 C6.8 12.2 8.6 10.5 11.5 11.5 C14.4 10.5 16.2 12.2 15 13.8 C14 16 9 16 8 13.8 Z" fill="#FF1493"/>

  <!-- Cute Heart Impact Stamp at Click Point (3, 3) -->
