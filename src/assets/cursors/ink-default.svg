<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <g transform="translate(1.5 1.5) rotate(45) scale(0.85 1) rotate(-45) translate(-1.5 -1.5)">
  <!-- 柔和微墨投影 -->
  <g opacity="0.35" transform="translate(1, 1)">
    <!-- 笔头阴影 -->
    <path d="M1.5 1.5 C2.5 4.5 4.5 8.5 7.5 10.5 L10.5 7.5 C8.5 4.5 4.5 2.5 1.5 1.5 Z" fill="#000000"/>
    <!-- 笔杆阴影 -->
    <path d="M8 11 L18.5 21.5 L21.5 18.5 L11 8 Z" fill="#000000"/>
  </g>

  <!-- 全局高对比度描边外廓（确保在纯黑与纯白背景下均丝滑锐利） -->
  <path d="M1.2 1.2 C2.3 4.6 4.3 8.8 7.2 10.8 L8.8 12.4 L19.4 23 C20.2 23.8 21.4 23.8 22.2 23 C23 22.2 23 21 22.2 20.2 L12.4 10.4 L10.8 8.8 C8.8 5.9 4.6 2.3 1.2 1.2 Z"
        fill="#FAF8F2" stroke="#121417" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- ── 笔杆部分 (Slender Bamboo Shaft with Joints) ── -->
  <!-- 湘妃竹/斑竹暖调笔杆主身 -->
  <path d="M9.8 11.4 L18.8 20.4 C19.2 20.8 19.8 20.8 20.2 20.4 L20.6 20 C21 19.6 21 19 20.6 18.6 L11.6 9.6 Z"
        fill="#A66B38"/>
  <!-- 竹杆受光面高光 (Bamboo cylinder highlight) -->
  <path d="M10.8 11.2 L19.4 19.8" stroke="#E2B67C" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 竹节凹纹与阴影 (Bamboo Joints) -->
  <path d="M14.5 13.5 L13.5 14.5" stroke="#5E3816" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M15 14 L14 15" stroke="#DCA266" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M17.8 16.8 L16.8 17.8" stroke="#5E3816" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 笔尾挂绳孔与红丝绳结 (Brush Tail Silk Loop) -->
  <circle cx="20.8" cy="20.8" r="1.4" fill="#3D200E"/>
  <path d="M21 21 L22.5 22.5" stroke="#C23531" stroke-width="1.1" stroke-linecap="round"/>

  <!-- ── 笔斗 / 箍箍 (Antique Horn & Brass Ferrule) ── -->
  <!-- 束毫牛角笔斗外廓 -->
  <path d="M7.4 10.6 L10.6 7.4 L12 8.8 L8.8 12 Z"
        fill="#26221E" stroke="#14110E" stroke-width="0.5"/>
  <!-- 笔斗黄铜环箍嵌线 (Brass Ring Accents) -->
  <path d="M8.2 11.4 L11.4 8.2" stroke="#D4AF37" stroke-width="0.9"/>
  <path d="M7.6 10.4 L10.4 7.6" stroke="#947620" stroke-width="0.6"/>

  <!-- ── 笔毫 / 笔头 (Calligraphy Brush Head - 尖齐圆健) ── -->
  <!-- 狼毫根部（栗色与兼毫浅色过渡） -->
  <path d="M1.5 1.5 C2.8 4.2 4.6 7.8 7.5 9.8 L9.8 7.5 C7.8 4.6 4.2 2.8 1.5 1.5 Z"
        fill="#8A5A36"/>

  <!-- 饱蘸焦墨的中前段与笔肚 (Plump Ink-Saturated Belly) -->
  <!-- 优美的水滴饱满弧度，呈现传统毛笔圆润笔肚与聚拢峰芒 -->
  <path d="M1.5 1.5 C2.4 3.8 3.8 6.8 6.5 8.2 L8.2 6.5 C6.8 3.8 3.8 2.4 1.5 1.5 Z"
        fill="#181A1D"/>

  <!-- 聚拢锋芒浓墨芯 (Pine Soot Needle Core) -->
  <path d="M1.5 1.5 C2 3 3.2 4.8 5 5.8 L5.8 5 C4.8 3.2 3 2 1.5 1.5 Z"
        fill="#0A0B0D"/>

  <!-- 笔毫细腻丝缕微光 (Fine Hair Bristle Strands) -->
  <path d="M2.6 3.6 C3.8 5.2 4.8 6.8 6.4 7.6" stroke="#525B68" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M3.6 2.6 C5.2 3.8 6.8 4.8 7.6 6.4" stroke="#9E764E" stroke-width="0.5" stroke-linecap="round"/>

  <!-- 极锐利笔锋聚墨尖点 (Precision Writing Tip at 1.5, 1.5) -->
  <circle cx="1.5" cy="1.5" r="0.75" fill="#FAF8F2"/>
  <circle cx="1.5" cy="1.5" r="0.45" fill="#0A0B0D"/>
  </g>
</svg>