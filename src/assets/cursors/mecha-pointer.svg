<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" fill="none">
  <!-- Reticle Shadow/Backdrop -->
  <circle cx="11" cy="11" r="8.5" stroke="#0E1012" stroke-width="2.5" fill="none" opacity="0.8"/>
  <!-- Targeting Octagon / Reticle Ring -->
  <circle cx="11" cy="11" r="8.5" stroke="#FFCC00" stroke-width="1.5" stroke-dasharray="7 3.5" fill="#14171A" fill-opacity="0.15"/>
  
  <!-- Four Corner Locking Clamps (Open Standby State) -->
  <path d="M4 7 L4 4 L7 4" stroke="#FFCC00" stroke-width="1.8" stroke-linecap="square"/>
  <path d="M18 7 L18 4 L15 4" stroke="#FFCC00" stroke-width="1.8" stroke-linecap="square"/>
  <path d="M4 15 L4 18 L7 18" stroke="#FFCC00" stroke-width="1.8" stroke-linecap="square"/>
  <path d="M18 15 L18 18 L15 18" stroke="#FFCC00" stroke-width="1.8" stroke-linecap="square"/>

  <!-- Telemetry Pitch Ticks -->
  <line x1="11" y1="1" x2="11" y2="4" stroke="#FF3B30" stroke-width="1.5"/>
  <line x1="11" y1="18" x2="11" y2="21" stroke="#FF3B30" stroke-width="1.5"/>
  <line x1="1" y1="11" x2="4" y2="11" stroke="#FFCC00" stroke-width="1.5"/>
  <line x1="18" y1="11" x2="21" y2="11" stroke="#FFCC00" stroke-width="1.5"/>

  <!-- Center Aiming Pip -->
  <circle cx="11" cy="11" r="1.5" fill="#FFCC00" stroke="#0E1012" stroke-width="0.8"/>
</svg>