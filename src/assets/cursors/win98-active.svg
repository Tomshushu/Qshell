<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" fill="none" shape-rendering="crispEdges">
  <!-- Drop shadow -->
  <rect x="6" y="3" width="12" height="18" fill="#000000" opacity="0.3" transform="translate(1, 1)"/>

  <!-- Top Wood/Steel Bar -->
  <rect x="4" y="2" width="14" height="2" fill="#000000"/>
  <rect x="5" y="3" width="12" height="1" fill="#008080"/>
  <rect x="5" y="2" width="11" height="1" fill="#FFFFFF"/>

  <!-- Bottom Wood/Steel Bar -->
  <rect x="4" y="18" width="14" height="2" fill="#000000"/>
  <rect x="5" y="18" width="12" height="1" fill="#808080"/>
  <rect x="5" y="19" width="12" height="1" fill="#000000"/>

  <!-- Glass Bulbs Outer Shell (Black Outline) -->
  <path d="M5 4 L17 4 L14 10 L14 12 L17 18 L5 18 L8 12 L8 10 Z" fill="#000000"/>
  <!-- Glass Interior Background (Transparent Cyan / Win98 Gray) -->
  <path d="M6 5 L16 5 L13 10 L13 12 L16 17 L6 17 L9 12 L9 10 Z" fill="#D4D0C8"/>

  <!-- Upper Sand (Cyan/Teal Sand trickling down) -->
  <path d="M7 6 L15 6 L13 9 L9 9 Z" fill="#000080"/>
  <rect x="10" y="8" width="2" height="1" fill="#008080"/>

  <!-- Flowing Sand Grains (Trickle) -->
  <line x1="11" y1="10" x2="11" y2="13" stroke="#000080" stroke-width="1"/>

  <!-- Bottom Sand Pile -->
  <polygon points="8,17 14,17 12,14 10,14" fill="#000080"/>
  <rect x="9" y="16" width="4" height="1" fill="#008080"/>

  <!-- Left Glass Highlight Reflection -->
  <line x1="6.5" y1="5.5" x2="8.5" y2="9.5" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="6.5" y1="16.5" x2="8.5" y2="12.5" stroke="#FFFFFF" stroke-width="1"/>
</svg>