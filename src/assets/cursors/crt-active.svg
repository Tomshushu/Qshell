<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22" fill="none" shape-rendering="crispEdges">
  <!-- Outer Targeting Ring -->
  <circle cx="11" cy="11" r="9" stroke="#1B4D1B" stroke-width="1.5" fill="#0A0E0A" fill-opacity="0.3"/>
  <circle cx="11" cy="11" r="6" stroke="#33FF33" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
  
  <!-- Crosshairs -->
  <line x1="1" y1="11" x2="6" y2="11" stroke="#33FF33" stroke-width="1.5"/>
  <line x1="16" y1="11" x2="21" y2="11" stroke="#33FF33" stroke-width="1.5"/>
  <line x1="11" y1="1" x2="11" y2="6" stroke="#33FF33" stroke-width="1.5"/>
  <line x1="11" y1="16" x2="11" y2="21" stroke="#33FF33" stroke-width="1.5"/>

  <!-- Target Lock Center -->
  <rect x="10" y="10" width="2" height="2" fill="#33FF33"/>
  <rect x="9.5" y="9.5" width="3" height="3" stroke="#88FF88" stroke-width="0.5" fill="none"/>
