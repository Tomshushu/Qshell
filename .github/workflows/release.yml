name: 'Release Qshell (全平台自动化打包与 OTA 发布)'

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");

            // 1. 检索已有 Release，清理由于历史失败或重试遗留的同名 Draft Releases，避免在 GitHub 产生重复版本
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50
            });
            const staleDrafts = releases.data.filter(r => r.tag_name === tag && r.draft);
            for (const stale of staleDrafts) {
              console.log(`Cleaning up stale draft release ID: ${stale.id}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: stale.id
              });
            }

            // 2. 检查是否已有已发布的 Release
            const published = releases.data.find(r => r.tag_name === tag && !r.draft);
            if (published) {
              console.log(`Found already published release ID: ${published.id}`);
              return published.id;
            }

            // 3. 创建新的 Draft Release
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Qshell ${tag}`,
              body: `## 🚀 Qshell ${tag} 正式版本发布\n\n现代化极速终端与多协议服务器管理工作台。详细更新内容请参阅版本提交日志。`,
              draft: true,
              prerelease: false
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'macos-latest'
            args: '--bundles app,dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri App & Sign with Minisign
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-and-sync:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish draft release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const lines = [
              `## 🚀 Qshell ${tag} 正式版本发布`,
              '',
              '> 现代化极速终端与多协议服务器管理工作台。',
              '',
              '### 详细说明',
              '- 详细更新内容请参阅 Commit 提交历史与版本变更记录。',
              '- 客户端内置 OTA 自动增量更新与 Minisign 数字签名校验。'
            ];
            const body = lines.join('\n');

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              body: body
            });

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Standardize Release Assets Naming (统一产物规范命名与补齐版本号)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const cleanVer = tag.replace(/^v/, '');
            const release_id = ${{ needs.create-release.outputs.release_id }};

            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id
            });

            // 1. 将 macOS 缺失版本号的 OTA 更新包重命名为标准格式
            const macTarGz = assets.data.find(a => a.name === 'Qshell_aarch64.app.tar.gz');
            if (macTarGz) {
              const newName = `Qshell_${cleanVer}_aarch64.app.tar.gz`;
              await github.rest.repos.updateReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: macTarGz.id,
                name: newName
              });
              console.log(`Renamed asset ${macTarGz.name} -> ${newName}`);
            }

            const macTarGzSig = assets.data.find(a => a.name === 'Qshell_aarch64.app.tar.gz.sig');
            if (macTarGzSig) {
              const newSigName = `Qshell_${cleanVer}_aarch64.app.tar.gz.sig`;
              await github.rest.repos.updateReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: macTarGzSig.id,
                name: newSigName
              });
              console.log(`Renamed asset ${macTarGzSig.name} -> ${newSigName}`);
            }

            // 2. 清理多余冗余资产（保持两端资产数完全一致）
            const redundantChina = assets.data.find(a => a.name === 'latest-china.json');
            if (redundantChina) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: redundantChina.id
              });
              console.log('Removed redundant latest-china.json');
            }

      - name: Download generated latest.json from Release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          MANIFEST_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/latest.json"
          echo "Downloading manifest from $MANIFEST_URL"
          curl -sL "$MANIFEST_URL" -o latest.json || echo "{}" > latest.json

      - name: Prepare clean manifest
        env:
          MANIFEST_PATH: 'latest.json'
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node tools/sync-release-manifest.mjs

      - name: Overwrite latest.json on Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const release_id = ${{ needs.create-release.outputs.release_id }};

            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id
            });

            // 删除原未经加速与规范化的 latest.json 并上传最新 latest.json
            if (fs.existsSync('latest.json')) {
              const existingLatest = assets.data.find(a => a.name === 'latest.json');
              if (existingLatest) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existingLatest.id
                });
                console.log('Deleted unaccelerated latest.json');
              }
              const fileData = fs.readFileSync('latest.json');
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                name: 'latest.json',
                data: fileData
              });
              console.log('Uploaded standardized latest.json successfully!');
            }

      - name: Sync Release to Gitee Releases (国内极速镜像发布)
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN || '12c9b9f0edf788cf0e5c308134e5e316' }}
          GITEE_OWNER: 'Tom-shushu'
          GITEE_REPO: 'qshell'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          MANIFEST_PATH: 'latest.json'
        run: |
          node tools/sync-gitee-release.mjs

      - name: Sync Release to Gitee via China Serverless Webhook (国内云函数全自动极速同步)
        continue-on-error: true
        run: |
          echo "Triggering China Serverless Sync for tag: ${{ github.ref_name }}..."
          curl -N -f --max-time 180 -X POST "https://qshell-tee-sync-anullfwzbd.cn-shanghai.fcapp.run" \
            -H "Content-Type: application/json" \
            -d '{"tag": "${{ github.ref_name }}", "secret": "Qshell_Release_Sync_2026"}'

