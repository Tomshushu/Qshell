[package]
name = "qshell"
version = "1.0.22"
description = "Qshell - Tauri Edition"
authors = ["Qshell Community"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "qshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# socket2: Telnet TCP keepalive 探测配置（tokio 自带的 set_keepalive 只能开启
# SO_KEEPALIVE，Windows 默认 2 小时才开始探测，无法及时发现 NAT 静默丢弃的死连接）
socket2 = "0.6"
# russh 0.64 默认 crypto backend 是 aws-lc-rs（Windows 需 NASM 汇编器），
# 改用纯预编译的 ring backend 避免 NASM 依赖；保留 flate2(压缩) + rsa(RSA 密钥)
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.1"
# ssh-key 用于 PPK (PuTTY) 格式私钥解析、证书加载、密钥生成，russh-keys 0.45 未开启 ppk feature
# 注: ssh-key 0.6 不含 ppk feature，需要 0.7+（当前为 RC）。
#     russh-keys 0.45 依赖 ssh-key 0.6，Cargo 会同时拉取 0.6 (transitive) 与 0.7 (direct)。
#     - getrandom: 提供 SysRng，用于 PrivateKey::random / encrypt
#     - p256/p384: ECDSA 曲线支持
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "encryption", "ppk", "ecdsa", "p256", "p384", "getrandom", "rand_core"] }
# sha2 用于计算 SSH 公钥的 SHA256 指纹（agent identity 展示）
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
argon2 = "0.5"
rand = "0.8"
regex = "1"
encoding_rs = "0.8"
codepage-strings = "1.0"
# Redfish API 客户端（BMC 带外管理）：rustls-tls 避免 OpenSSL 依赖；BMC 普遍使用自签名证书，
# 运行时通过 danger_accept_invalid_certs 兼容
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
# FTPS (Explicit AUTH TLS / Implicit TLS) 客户端复用 reqwest 同版本的 rustls + ring 后端，零额外 C 依赖
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
dirs = "6"
lazy_static = "1"
serialport = "4.6"
# portable-pty: 本地 Shell（Windows ConPTY / macOS & Linux PTY）跨平台伪终端后端
portable-pty = "0.9"
# zip: X Server 插件包离线导入。仅启用 deflate（最常见压缩方式），避免使用外部
# `tar -xf` 带来的 zip-slip 与 Windows/Unix 行为差异；路径由 enclosed_name 校验。
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
# P0-03 智能卡 PKCS#11 动态库封装（运行时加载 opensc-pkcs11 / libykcs11 等驱动，编译期零 C 依赖）
cryptoki = "0.10"
# P0-04 Unix 端运行时动态加载系统 GSSAPI/Kerberos（Windows 端直接走 windows-sys 原生 SSPI，零编译期 C 依赖）
libloading = "0.8"

# Windows API（用于获取全局鼠标位置和按键状态，支持跨窗口拖拽合并；磁盘空间查询）
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials"] }

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"

[patch.crates-io]
russh-sftp = { path = "patches/russh-sftp" }
